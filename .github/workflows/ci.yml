# Os mesmos checks do hook Stop (.claude/hooks/gate-stop.ts). Versões das actions aferidas em 2026-10-21.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesmas imagens (e digests) da deploy/quadlet/merma-redis.container e da merma-postgres.container: os adapters do
    # snapshot e do histórico são testados contra o Redis e o Postgres da produção. O deploy/quadlet.test.ts confere
    # que não divergem. O digest é o do image index (multi-arch), não o de um manifest de plataforma: o runner é
    # amd64 e a PoC rodou em arm64.
    services:
      redis:
        image: docker.io/library/redis:8@sha256:0a014ae5c04f55c82aaad2314de411c7a203de1c4312c3e526939226a0185dd9
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: docker.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: merma
          POSTGRES_PASSWORD: merma
          POSTGRES_DB: merma
        options: --health-cmd "pg_isready -U merma" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
      POSTGRES_URL: postgres://merma:merma@127.0.0.1:5432/merma
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o docs:check compara os ADRs aceitos com o commit em que foram aceitos (ADR-0022.R2).
          fetch-depth: 0
      # Sem bun-version: lê o packageManager do package.json (ADR-0018.R4).
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
