# Os mesmos checks do hook Stop (.claude/hooks/gate-stop.ts). Versões das actions aferidas em 2026-10-21.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o docs:check compara os ADRs aceitos com o commit em que foram aceitos (ADR-0019.R2).
          fetch-depth: 0
      # Sem bun-version: lê o packageManager do package.json (ADR-0018.R4).
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
