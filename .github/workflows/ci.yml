# Os mesmos checks do hook Stop (.claude/hooks/gate-stop.ts). Versões das actions aferidas em 2026-10-21.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesma imagem (e digest) da deploy/quadlet/merma-redis.container: o adaptador do snapshot é testado contra o
    # Redis da produção. O deploy/quadlet.test.ts confere que as duas não divergem.
    services:
      redis:
        image: docker.io/library/redis:8@sha256:701d27eed8cbd5042c98ec4035146ed036c2390a31ddd9f3f617b4a5e316e12d
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o docs:check compara os ADRs aceitos com o commit em que foram aceitos (ADR-0022.R2).
          fetch-depth: 0
      # Sem bun-version: lê o packageManager do package.json (ADR-0018.R4).
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
